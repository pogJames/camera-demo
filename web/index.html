<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPU sequence demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <div class="video"><img src="/stream" alt="live stream"></div>
    <div class="panel">
      <header class="panel-head">
        <h1>CAMERA DEMO</h1>
        <a class="runs-link" href="/runs">Analytics</a>
      </header>
      <div class="panel-body">
        <div id="banner" class="banner hidden"></div>
        <section class="section when-scanned">
          <div class="label">Product</div>
          <div id="part"></div>
        </section>
        <section class="section when-running">
          <div class="label">Steps</div>
          <ul id="steps" class="steps"></ul>
        </section>
        <section class="section when-running">
          <div class="label">Indicators</div>
          <div id="lamps" class="lamps"></div>
        </section>
      </div>
      <button class="when-scanned" onclick="doReset()">RESET</button>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
